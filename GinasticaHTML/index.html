<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Treino - Fev/Mar</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --primary-color: #ff0080;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text-white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-white);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        #app-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
        }

        #video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
        }

        #timer-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-bottom: 5px solid var(--primary-color);
        }

        #timer {
            font-size: 4rem;
            font-weight: bold;
            margin: 10px 0;
        }

        #exercise-name {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin: 0;
        }

        #status-label {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        button {
            background: var(--card-bg);
            border: 2px solid var(--primary-color);
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: var(--primary-color);
        }

        #exercise-list {
            list-style: none;
            padding: 0;
            margin-top: 30px;
        }

        #exercise-list li {
            background: #252525;
            margin-bottom: 8px;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
        }

        #exercise-list li.active {
            border-left: 4px solid var(--primary-color);
            background: #333;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="video-container">
        <div id="youtube-player"></div>
        <div id="video-overlay" style="position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center;">
            <button id="start-btn" style="font-size:1.2rem; padding: 20px 40px;">INICIAR TREINO</button>
        </div>
    </div>

    <div id="timer-card">
        <div id="status-label">Aguardando...</div>
        <h2 id="exercise-name">Pronto?</h2>
        <div id="timer">00:00</div>
        <p id="exercise-instruction" style="font-size: 0.9rem; opacity: 0.8;"></p>
        
        <div class="controls">
            <button id="prev-btn">⏮</button>
            <button id="play-pause-btn">
                <span id="play-icon">▶</span>
                <span id="pause-icon" style="display:none">||</span>
            </button>
            <button id="next-btn">⏭</button>
        </div>
    </div>

    <ul id="exercise-list"></ul>
</div>

<script>
// AQUI VAI O CÓDIGO JS QUE O ANTIGRAVITY GEROU (COM PEQUENOS AJUSTES PARA O HTML ACIMA)

</script>
</body>
</html>
